
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP3 - Suivi des mains et pincement</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #111;
    color: #fff;
  }

  #zone {
    position: relative;
    width: 100vw;
    max-width: 640px;
    min-height: 200px;
    margin: 0 auto;
    background: #000;
  }

  video, canvas {
    width: 100%;
    display: block;
    transform: scaleX(-1);
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  #panneau {
    padding: 10px 14px;
    font-size: 17px;
  }

  #etatPince {
    font-size: 34px;
    font-weight: bold;
  }

  label {
    display: block;
    margin: 6px 0;
  }

  button {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 0;
    background: #1565c0;
    color: #fff;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  #statut {
    margin-top: 8px;
    overflow-wrap: anywhere;
  }
</style>
</head>

<body>

<div id="zone">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="dessin"></canvas>
</div>

<div id="panneau">

  <button id="start">Démarrer la caméra</button>

  <div id="statut">En attente.</div>

  <div id="etatPince">-</div>

  <div>
    Ratio pouce-index / paume :
    <b id="ratio">-</b>
    |
    Confiance main :
    <b id="conf">-</b>
  </div>

  <div>
    Pincements détectés :
    <b id="nbPinces">0</b>
    |
    Parasites (aller-retour &lt; 300 ms) :
    <b id="nbParasites">0</b>
  </div>

  <label>
    <input type="checkbox" id="hyst" checked>
    Hystérésis (deux seuils)
  </label>

  <label>
    Seuil d'entrée (pince) :
    <b id="vOn">0.25</b>
    <input type="range" id="sOn"
           min="0.10" max="0.60" step="0.01"
           value="0.25" style="width:100%">
  </label>

  <label>
    Seuil de sortie (ouvre) :
    <b id="vOff">0.45</b>
    <input type="range" id="sOff"
           min="0.10" max="0.80" step="0.01"
           value="0.45" style="width:100%">
  </label>

</div>

<!-- ============ Logique pure ============ -->

<script>

function dist(a, b, w, h) {
  return Math.hypot(
    (a.x - b.x) * w,
    (a.y - b.y) * h
  );
}

function ratioPincement(L, w, h) {
  const paume = dist(L[0], L[9], w, h);

  return paume > 0
    ? dist(L[4], L[8], w, h) / paume
    : 1;
}

function majPincement(etat, ratio, t, cfg) {

  const seuilOff = cfg.hyst ? cfg.off : cfg.on;

  if (!etat.pince) {

    if (ratio < cfg.on) {

      if (etat.debut === null) {
        etat.debut = t;
      }

      if (t - etat.debut >= cfg.maintienMs) {

        etat.pince = true;
        etat.debut = null;

        return 'debut';
      }

    } else {
      etat.debut = null;
    }

  } else if (ratio > seuilOff) {

    etat.pince = false;

    return 'fin';
  }

  return null;
}

</script>

<!-- ============ MediaPipe ============ -->

<script type="module">

const $ = id => document.getElementById(id);

const video = $('video');
const canvas = $('dessin');
const ctx = canvas.getContext('2d');

const VERSION = '0.10.14';

const CDN =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}`;

const WASM_URL = CDN + '/wasm';

const MODEL_URL =
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

let landmarker = null;
let fluxCamera = null;
let animationActive = false;
let demarrageEnCours = false;

const etat = {
  pince: false,
  debut: null
};

let nbPinces = 0;
let nbParasites = 0;
let tDebutPince = 0;

$('sOn').oninput = e => {
  $('vOn').textContent = e.target.value;
};

$('sOff').oninput = e => {
  $('vOff').textContent = e.target.value;
};

/* ---------- Chargement de MediaPipe ---------- */

async function creerLandmarker() {

  $('statut').textContent =
    'Étape 1/3 : chargement de MediaPipe...';

  // Importation dynamique pour afficher les erreurs du CDN
  let MediaPipe;

  try {

    MediaPipe = await import(
      CDN + '/vision_bundle.mjs'
    );

  } catch (e) {

    throw new Error(
      'Impossible de charger la bibliothèque MediaPipe. Vérifiez votre connexion Internet et le CDN jsDelivr. ' + e.message
    );
  }

  const { HandLandmarker, FilesetResolver } = MediaPipe;

  $('statut').textContent =
    'Étape 2/3 : chargement des fichiers WASM...';

  let fileset;

  try {

    fileset = await FilesetResolver.forVisionTasks(
      WASM_URL
    );

  } catch (e) {

    throw new Error(
      'Impossible de charger les fichiers WASM. Vérifiez le CDN jsDelivr. ' + e.message
    );
  }

  $('statut').textContent =
    'Étape 3/3 : chargement du modèle de reconnaissance...';

  try {

    return await HandLandmarker.createFromOptions(
      fileset,
      {
        baseOptions: {
          modelAssetPath: MODEL_URL,
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numHands: 1
      }
    );

  } catch (gpuError) {

    console.warn(
      'GPU indisponible : tentative avec CPU',
      gpuError
    );

    try {

      return await HandLandmarker.createFromOptions(
        fileset,
        {
          baseOptions: {
            modelAssetPath: MODEL_URL,
            delegate: 'CPU'
          },
          runningMode: 'VIDEO',
          numHands: 1
        }
      );

    } catch (cpuError) {

      throw new Error(
        'Impossible de charger le modèle Hand Landmarker. Vérifiez l’accès à Google Storage. ' + cpuError.message
      );
    }
  }
}

/* ---------- Démarrage de la caméra ---------- */

$('start').onclick = async () => {

  if (demarrageEnCours) return;

  demarrageEnCours = true;
  $('start').disabled = true;

  try {

    // Chargement du modèle
    landmarker = await creerLandmarker();

    // Demande d'accès à la caméra
    $('statut').textContent =
      'Activation de la caméra...';

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        'Caméra inaccessible. Utilisez HTTPS ou localhost avec Live Server.'
      );
    }

    fluxCamera = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      },

      audio: false

    });

    video.srcObject = fluxCamera;

    await new Promise((resolve, reject) => {

      video.onloadedmetadata = resolve;

      video.onerror = () => reject(
        new Error('Erreur de chargement de la vidéo.')
      );

    });

    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    $('statut').textContent =
      'Caméra activée ! Montrez votre main.';

    $('start').textContent = 'Caméra démarrée';

    animationActive = true;

    boucle();

  } catch (e) {

    console.error('Erreur complète :', e);

    $('statut').textContent =
      'Erreur : ' + e.message;

    $('start').disabled = false;

    if (fluxCamera) {

      fluxCamera.getTracks().forEach(track => track.stop());

      fluxCamera = null;
    }

    if (landmarker) {

      landmarker.close();
      landmarker = null;
    }

  } finally {

    demarrageEnCours = false;
  }
};

/* ---------- Détection et dessin ---------- */

let dernierT = -1;

function boucle() {

  if (!animationActive) return;

  try {

    if (video.readyState >= 2 &&
        video.currentTime !== dernierT) {

      dernierT = video.currentTime;

      const t = performance.now();

      const res = landmarker.detectForVideo(video, t);

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const L = res.landmarks && res.landmarks[0];

      if (L) {

        const w = canvas.width;
        const h = canvas.height;

        // Dessin des 21 points de la main
        ctx.fillStyle = '#00e676';

        L.forEach(p => {

          ctx.beginPath();

          ctx.arc(
            p.x * w,
            p.y * h,
            4,
            0,
            6.28
          );

          ctx.fill();
        });

        // Pouce et index
        ctx.fillStyle = '#ff5252';

        [4, 8].forEach(i => {

          ctx.beginPath();

          ctx.arc(
            L[i].x * w,
            L[i].y * h,
            8,
            0,
            6.28
          );

          ctx.fill();
        });

        // Calcul du ratio
        const r = ratioPincement(L, w, h);

        const hd = res.handedness || res.handednesses;

        $('ratio').textContent = r.toFixed(2);

        $('conf').textContent =
          hd && hd[0] && hd[0][0]
            ? hd[0][0].score.toFixed(2)
            : '-';

        // Paramètres du pincement
        const cfg = {

          on: +$('sOn').value,

          off: +$('sOff').value,

          hyst: $('hyst').checked,

          maintienMs: 100
        };

        const ev = majPincement(
          etat,
          r,
          t,
          cfg
        );

        // Début du pincement
        if (ev === 'debut') {

          tDebutPince = t;

          nbPinces++;

          if (navigator.vibrate) {
            navigator.vibrate(20);
          }
        }

        // Fin du pincement
        if (ev === 'fin' &&
            t - tDebutPince < 300) {

          nbParasites++;
        }

        // Affichage de l'état
        $('etatPince').textContent =
          etat.pince ? 'PINCE (select)' : 'ouvert';

        $('etatPince').style.color =
          etat.pince ? '#00e676' : '#fff';

        $('nbPinces').textContent = nbPinces;

        $('nbParasites').textContent = nbParasites;

      } else {

        $('etatPince').textContent = 'main perdue';

        $('ratio').textContent = '-';
        $('conf').textContent = '-';

        etat.pince = false;
        etat.debut = null;
      }
    }

  } catch (e) {

    console.error('Erreur de détection :', e);

    $('statut').textContent =
      'Erreur pendant la détection : ' + e.message;

    animationActive = false;

    return;
  }

  requestAnimationFrame(boucle);
}

</script>

</body>
</html>
